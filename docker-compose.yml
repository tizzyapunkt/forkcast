# forkcast for self-hosting: the public images, one data volume, settings from .env next to this
# file (AUTH_PASSWORD, AUTH_JWT_SECRET, optional ANTHROPIC_API_KEY; see backend/.env.example).
services:
  backend:
    image: tizzyapunkt/forkcast-backend:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - forkcast_data:/app/backend/data

  frontend:
    image: tizzyapunkt/forkcast-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  forkcast_data:
