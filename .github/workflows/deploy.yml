name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and deploy
        required: false
        default: main
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          push: true
          file: backend/Dockerfile
          context: .
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/forkcast-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          push: true
          file: frontend/Dockerfile
          context: .
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/forkcast-frontend:latest
